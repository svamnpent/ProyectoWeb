name: API CI - Spring Boot

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'ProyectoGeneral/api/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'ProyectoGeneral/api/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Probar con Maven
        working-directory: ./ProyectoGeneral/api
        # MAVEN_OPTS fuerza a la JVM de los tests a usar la zona horaria de Perú
        env:
          MAVEN_OPTS: "-Duser.timezone=America/Lima"
          JWT_SECRET: un_secreto_super_largo_y_seguro_para_los_tests_de_github_actions
        run: mvn -B clean test
