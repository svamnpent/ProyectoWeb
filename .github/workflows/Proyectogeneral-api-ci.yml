name: API CI - Spring Boot con Docker

on:
  push:
    branches: [main, develop]
    paths:
      - "ProyectoGeneral/api/**"
      - "ProyectoGeneral/docker-compose.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ProyectoGeneral/api/**"
      - "ProyectoGeneral/docker-compose.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      TZ: America/Lima
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Lima
      POSTGRES_DB: phantom_ci
      DB_USERNAME: phantom_ci
      DB_PASSWORD: password_solo_para_ci
      JWT_SECRET: clave_temporal_exclusiva_para_pruebas_de_integracion_ci

    defaults:
      run:
        working-directory: ProyectoGeneral

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ProyectoGeneral/api/pom.xml

      - name: Ejecutar pruebas unitarias de la API
        working-directory: ProyectoGeneral/api
        run: bash ./mvnw -B -ntp test

      - name: Construir la API y esperar a que PostgreSQL y Spring estén saludables
        run: docker compose up -d --build --wait --wait-timeout 180 db api

      - name: Mostrar logs si falla el arranque
        if: failure()
        run: docker compose logs --no-color db api

      - name: Apagar contenedores y eliminar volúmenes de CI
        if: always()
        run: docker compose down -v
