name: API CI - Spring Boot con Docker

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'ProyectoGeneral/api/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'ProyectoGeneral/api/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Creamos un archivo .env idéntico al que usarías localmente
      - name: Configurar archivo .env para el contenedor de la BD
        working-directory: ./ProyectoGeneral/api
        run: |
          echo "POSTGRES_DB=phantom_db" > .env
          echo "DB_USERNAME=test_user" >> .env
          echo "DB_PASSWORD=test_password" >> .env
          echo "JWT_SECRET=un_secreto_super_largo_y_seguro_para_los_tests_de_github_actions" >> .env

      # 2. Construimos la imagen y levantamos los servicios usando Docker Compose
      - name: Levantar entorno Docker Compose (Base de Datos + API)
        working-directory: ./ProyectoGeneral/api
        run: docker compose up -d --build

      # 3. Forzamos la ejecución de "mvn test" DENTRO del contenedor de la API que ya está en la zona de Perú
      - name: Ejecutar los Tests dentro del Contenedor de la API
        working-directory: ./ProyectoGeneral/api
        run: docker compose exec -T api mvn test

      # 4. Buena práctica: Apagar los contenedores al finalizar
      - name: Apagar contenedores
        if: always()
        working-directory: ./ProyectoGeneral/api
        run: docker compose down -v
