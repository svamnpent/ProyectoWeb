name: API CI - Spring Boot

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'ProyectoGeneral/api/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'ProyectoGeneral/api/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Probar con Maven
        working-directory: ./ProyectoGeneral/api
        # Forzamos a Spring a cargar las propiedades de test mediante el argumento -Dspring.config.name
        run: mvn -B clean test -Dspring.config.name=application-test
        env:
          # Inyectamos el secreto necesario para que cargue la configuración de seguridad en el CI
          JWT_SECRET: $%&123qwerty$%&123qwerty$%&123qwerty$%&123qwerty$%&123qwerty$%&123qwerty$%&123qwerty$%&123qwerty
