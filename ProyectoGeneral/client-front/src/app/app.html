<header class="encabezado">
  <div class="contenedor encabezado__barra">
    <a class="encabezado__marca" routerLink="/">PHANTOM</a>

    <nav class="encabezado__nav" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">
        Inicio
      </a>
    </nav>

    <div class="encabezado__sesion">
      <span class="encabezado__carrito" aria-label="Productos en el carrito">
        Carrito
        <span class="encabezado__insignia">{{ carrito.cantidadTotal() }}</span>
      </span>

      @if (auth.estaAutenticado()) {
        <span class="encabezado__saludo">
          Hola, <strong>{{ auth.primerNombre() }}</strong>
        </span>
        <button type="button" class="btn btn--acento" (click)="cerrarSesion()">
          Cerrar sesión
        </button>
      } @else {
        <a class="btn btn--contorno encabezado__ingresar" routerLink="/login">Ingresar</a>
      }
    </div>
  </div>
</header>

<main class="contenido">
  <router-outlet />
</main>

<footer class="pie">
  <div class="contenedor">© {{ anio }} PHANTOM. Todos los derechos reservados.</div>
</footer>
