<header class="encabezado">
  <div class="contenedor encabezado__barra">
    <a class="encabezado__marca" routerLink="/" aria-label="PHANTOM · Inicio">
      @if (logoDisponible) {
        <img src="phantom-logo.svg" alt="PHANTOM" (error)="logoDisponible = false">
      } @else { PHANTOM }
    </a>

    <nav class="encabezado__nav" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">
        Inicio
      </a>
      <a routerLink="/buscar" routerLinkActive="activo">Buscar</a>
      @if (auth.estaAutenticado()) {
        <a routerLink="/mis-pedidos" routerLinkActive="activo">Mis pedidos</a>
      }
      @if (auth.esStaff()) {
        <a routerLink="/backoffice" routerLinkActive="activo">Back-office</a>
      }
    </nav>

    <div class="encabezado__sesion">
      <a
        class="encabezado__carrito"
        routerLink="/carrito"
        routerLinkActive="activo"
        aria-label="Ver carrito"
      >
        Carrito
        <span class="encabezado__insignia">{{ carrito.cantidadTotal() }}</span>
      </a>

      @if (auth.estaAutenticado()) {
        <a class="encabezado__saludo" routerLink="/mi-cuenta" routerLinkActive="activo">Mi cuenta</a>
        <button type="button" class="btn btn--acento" (click)="cerrarSesion()">
          Cerrar sesión
        </button>
      } @else {
        <a class="btn btn--contorno encabezado__ingresar" routerLink="/login">Ingresar</a>
      }
    </div>
  </div>
</header>

<main class="contenido">
  <router-outlet />
</main>

<footer class="pie">
  <div class="contenedor">© {{ anio }} PHANTOM. Todos los derechos reservados.</div>
</footer>
