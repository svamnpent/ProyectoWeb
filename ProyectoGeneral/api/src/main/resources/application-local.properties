spring.application.name=api

# CONEXIÓN A BASE DE DATOS H2 EN MEMORIA CON MODO POSTGRESQL
spring.datasource.url=jdbc:h2:mem:phantom_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin_api
spring.datasource.password=contrasena123

# HABILITAR CONSOLA H2 WEB
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CONFIGURACIÓN DE JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY DESACTIVADO EN PERFIL LOCAL CON H2
spring.flyway.enabled=false

# CONFIGURACIÓN DEL SERVIDOR
server.port=8080

# FORMATO DE LOGS
spring.output.ansi.enabled=ALWAYS
spring.mvc.problemdetails.enabled=false

# CONFIGURACIÓN JWT (SPRING SECURITY)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

