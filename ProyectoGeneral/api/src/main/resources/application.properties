spring.application.name=api

# =============================================================================
# CONEXIÓN A LA BASE DE DATOS (PostgreSQL en Docker)
# Las variables DB_URL / DB_USERNAME / DB_PASSWORD se mantienen igual que antes.
# DB_URL y DB_USERNAME tienen valor por defecto para desarrollo local; DB_PASSWORD es obligatoria.
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/phantom_db}
spring.datasource.username=${DB_USERNAME:phantom}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
# Desactiva OSIV para un mejor manejo de conexiones en APIs REST
spring.jpa.open-in-view=false
# Reduce el problema N+1 en colecciones/proxies lazy
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# El SQL detallado se activa solo con el perfil "local" (ver application-local.properties)
spring.jpa.show-sql=false

# =============================================================================
# FLYWAY (MIGRACIONES)
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================================
# SERVIDOR
# =============================================================================
server.port=8080
server.shutdown=graceful
spring.output.ansi.enabled=ALWAYS
logging.level.org.flywaydb=INFO

# =============================================================================
# CACHÉ LOCAL (Caffeine, en memoria del proceso)
# Cachés usadas: categorias, etiquetas, productos (ver CacheNames)
# =============================================================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m,recordStats

# =============================================================================
# SEGURIDAD (JWT)
# JWT_SECRET es obligatorio y debe tener al menos 32 caracteres.
# Genera uno con:  openssl rand -base64 48
# =============================================================================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.security.jwt.issuer=phantom-api

# Bloqueo temporal de login tras demasiados intentos fallidos (por email)
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# Orígenes permitidos para CORS (separados por coma). Vacío = CORS deshabilitado.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Administrador inicial: se crea al arrancar solo si ADMIN_EMAIL y ADMIN_PASSWORD están definidos
# y no existe ya un usuario con ese email. Nunca se sobrescribe uno existente.
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.nombre=${ADMIN_NOMBRE:Administrador}

# =============================================================================
# ACTUATOR (solo health; sin detalles)
# =============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# =============================================================================
# SWAGGER / OPENAPI  (desactívalo en producción con SPRINGDOC_ENABLED=false)
# =============================================================================
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
