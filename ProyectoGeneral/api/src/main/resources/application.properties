spring.application.name=api

# CONEXIÓN A LA BASE DE DATOS (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# CONFIGURACIÓN DE JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Desactiva OSIV para mejorar el rendimiento y manejo de conexiones en APIs REST
spring.jpa.open-in-view=false

# Muestra en consola las consultas SQL generadas por JPA (útil en desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CONFIGURACIÓN DE FLYWAY (MIGRACIONES DE BD)
spring.flyway.enabled=true
# Ruta donde se encuentra el script V1__crear_esquema_inicial.sql
spring.flyway.locations=classpath:db/migration
# Evita fallos si la base de datos se limpia en desarrollo
spring.flyway.baseline-on-migrate=true

# CONFIGURACIÓN DEL SERVIDOR
server.port=8080

# Conf de ERRORES

# Formato legible y con color para la consola de desarrollo
spring.output.ansi.enabled=ALWAYS

# Eleva el nivel de detalle de logs para JPA/Flyway si ocurren fallos
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO

# Formatea las excepciones con GlobalExceptionHandler (ErrorResponse estándar)
spring.mvc.problemdetails.enabled=false

# CONFIGURACIÓN JWT (SPRING SECURITY)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}