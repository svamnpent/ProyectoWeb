# Perfil "test": usado por los tests de integración (*IT).
# La conexión real a PostgreSQL la inyecta Testcontainers (@ServiceConnection) y
# tiene prioridad sobre estos valores, que solo evitan placeholders sin resolver.
spring.datasource.url=jdbc:postgresql://localhost:5432/unused
spring.datasource.username=unused
spring.datasource.password=unused

app.security.jwt.secret=clave-de-pruebas-solo-para-tests-0123456789-abcdef
app.security.jwt.expiration-minutes=30
app.security.login.max-attempts=3
app.security.login.lock-minutes=15

app.bootstrap.admin.email=admin@test.local
app.bootstrap.admin.password=Admin12345
app.bootstrap.admin.nombre=Admin Test

spring.jpa.show-sql=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
