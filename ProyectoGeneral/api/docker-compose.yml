# Uso:
#   cp .env.example .env     (y edita los valores)
#   docker compose up -d --build
#
# Solo la base de datos (para ejecutar la API desde tu IDE):
#   docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: phantom-db
    restart: unless-stopped
    # Zona horaria de Perú (se aplica siempre, aunque el volumen ya exista)
    command: ["postgres", "-c", "timezone=America/Lima", "-c", "log_timezone=America/Lima"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phantom_db}
      POSTGRES_USER: ${DB_USERNAME:?Define DB_USERNAME en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - phantom-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    container_name: phantom-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro de la red de compose el host de la BD es el nombre del servicio: "db"
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-phantom_db}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  phantom-db-data:
