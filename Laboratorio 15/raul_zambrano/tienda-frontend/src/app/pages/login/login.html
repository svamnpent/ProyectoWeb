<section class="tarjeta">
  <h1>Ingreso</h1>
  <p>La sesión usa JWT y se guarda solo en memoria.</p>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <form [formGroup]="formulario" (ngSubmit)="ingresar()">
    <label for="username">Usuario</label>
    <input id="username" formControlName="username" autocomplete="username" />
    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    <button type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
  <p class="ayuda">Admin: admin / Admin123* · Usuario: usuario / Usuario123*</p>
</section>
